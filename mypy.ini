[mypy]
python_version = 3.10
# SidePeek is Windows-only: ctypes.WinDLL, WINFUNCTYPE and winreg only exist
# in the Windows view of the stdlib, so the check must run against the win32
# platform even when mypy itself runs on a Linux CI runner.
platform = win32
warn_unused_configs = True
warn_redundant_casts = True
check_untyped_defs = True
no_implicit_optional = True
files = sidepeek, run.py
