name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build executable
        shell: cmd
        run: build_exe.bat

      - name: Verify the artifact
        shell: pwsh
        run: |
          $exe = Get-Item dist/SidePeek.exe
          "size: {0:N1} MB" -f ($exe.Length / 1MB)
          $info = $exe.VersionInfo
          "product: {0} {1}" -f $info.ProductName, $info.ProductVersion
          if ($info.ProductName -ne "SidePeek") { throw "version resource missing" }
          if ($exe.Length -lt 1MB) { throw "unexpectedly small executable" }

      - uses: actions/upload-artifact@v4
        with:
          name: SidePeek-windows-x64
          path: dist/SidePeek.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SidePeek.exe
          generate_release_notes: true
